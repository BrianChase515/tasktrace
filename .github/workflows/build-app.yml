name: build-app

# Builds TaskTrace.app (with its own Python inside), signs it with the project certificate,
# checks that its dialogs respond to a real click and that in-app updates work, wraps it in
# a .dmg, and publishes it as the "latest" download (plus latest.json for in-app updates).
# Nothing is published unless every check passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest  # Apple silicon
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sw_vers | tee -a build.log
          python -m pip install --upgrade pip 2>&1 | tee -a build.log
          pip install py2app Pillow . 2>&1 | tee -a build.log

      - name: Icon
        working-directory: packaging
        run: python make_icon.py 2>&1 | tee -a ../build.log

      - name: Build TaskTrace.app
        working-directory: packaging
        run: python setup_app.py py2app 2>&1 | tail -n 200 | tee -a ../build.log

      - name: Check the certificate format works (scratch copy, test-only certificate)
        run: |
          # packaging/format-test-only.p12 is public and trusted by nothing; it only proves a .p12
          # made the same way as the real one imports and signs on this macOS.
          ditto packaging/dist/TaskTrace.app "$RUNNER_TEMP/scratch/TaskTrace.app"
          TASKTRACE_SIGNING_P12="$(base64 < packaging/format-test-only.p12)" \
            bash packaging/sign.sh "$RUNNER_TEMP/scratch/TaskTrace.app" 2>&1 | tee -a build.log
          rm -rf "$RUNNER_TEMP/scratch" signing-mode.txt

      - name: Sign with the TaskTrace certificate
        env:
          TASKTRACE_SIGNING_P12: ${{ secrets.TASKTRACE_SIGNING_P12 }}
        run: |
          bash packaging/sign.sh packaging/dist/TaskTrace.app 2>&1 | tee -a build.log
          echo "SIGNING=$(cat signing-mode.txt)" >> "$GITHUB_ENV"

      - name: Self-test
        run: packaging/dist/TaskTrace.app/Contents/MacOS/TaskTrace --self-test 2>&1 | tee -a build.log

      - name: First launch with no permissions (clicked from outside, like a real mouse)
        run: |
          echo "--- first launch with no permissions ---" | tee -a build.log
          python packaging/real_launch_check.py packaging/dist/TaskTrace.app "$PWD/first-launch" 2>&1 | tee -a build.log \
            || { echo "FIRST_LAUNCH_FAILED=1" >> "$GITHUB_ENV"; }
          [ -f first-launch/sample.txt ] && { echo "--- where the app was stuck ---"; head -120 first-launch/sample.txt; } | tee -a build.log || true
          ( cd first-launch && zip -q ../first-launch.zip * ) || true

      - name: Allow the dialog check to click (on this build machine only)
        run: |
          # The check posts real mouse clicks. On a person's Mac that needs their OK; here we grant it
          # in the build machine's permission database so a normally-launched TaskTrace can be tested.
          NOW=$(date +%s)
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for SVC in kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent kTCCServiceScreenCapture; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('$SVC','io.github.brianchase515.tasktrace',0,2,4,1,0,$NOW);" 2>&1 | tee -a build.log || true
            done
          done
          sudo killall tccd 2>/dev/null || true

      - name: Dialog check (click every button like a person)
        run: |
          mkdir -p shots
          # The build machine's own shell may click and take screenshots; take some while the check runs.
          ( for i in $(seq -w 1 30); do screencapture -x "shots/screen-$i.png"; sleep 4; done ) &
          SHOOTER=$!
          echo "--- dialog check: launched like a person would (open) ---" | tee -a build.log
          open -W packaging/dist/TaskTrace.app --args --ui-check "$PWD/uicheck-open.json"
          cat uicheck-open.json | tee -a build.log
          echo "--- dialog check: run directly from the build shell ---" | tee -a build.log
          TASKTRACE_UICHECK_SHOTS="$PWD/shots" packaging/dist/TaskTrace.app/Contents/MacOS/TaskTrace --ui-check "$PWD/uicheck-direct.json" || true
          cat uicheck-direct.json | tee -a build.log
          kill $SHOOTER || true
          ( cd shots && zip -q ../dialog-screens.zip *.png ) || true
          gh release delete diagnostics --yes --cleanup-tag || true
          gh release create diagnostics dialog-screens.zip uicheck-open.json uicheck-direct.json first-launch.zip --prerelease \
            --target "$GITHUB_SHA" --title "Build diagnostics" --notes "Screenshots and results from the dialog check." || true
          python - <<'PY'
          import json, os, sys
          runs = [json.load(open(f)) for f in ("uicheck-open.json", "uicheck-direct.json")]
          usable = [r for r in runs if r.get("can_post_clicks")]
          print("runs where the test could click:", len(usable), "| normal launch could click:", runs[0].get("can_post_clicks"))
          first_launch_ok = not os.environ.get("FIRST_LAUNCH_FAILED")
          print("first launch with no permissions:", "ok" if first_launch_ok else "FAILED")
          sys.exit(0 if usable and all(r.get("current_code_ok") for r in usable) and first_launch_ok else 1)
          PY

      - name: Make .dmg
        run: |
          VERSION=$(python -c "import tasktrace; print(tasktrace.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dmg && cp -R packaging/dist/TaskTrace.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "TaskTrace" -srcfolder dmg -ov -format UDZO "TaskTrace.dmg" 2>&1 | tee -a build.log
          du -h "TaskTrace.dmg" | tee -a build.log

      - name: Update check (install over itself, refuse a foreign or corrupted build)
        run: |
          echo "--- update check ---" | tee -a build.log
          python packaging/update_check.py packaging/dist/TaskTrace.app TaskTrace.dmg 2>&1 | tee -a build.log

      - name: Publish as the "latest" download
        run: |
          python - <<'PY'
          import hashlib, json, os
          info = {
              "version": os.environ["VERSION"],
              "sha256": hashlib.sha256(open("TaskTrace.dmg", "rb").read()).hexdigest(),
              "dmg": "https://github.com/BrianChase515/tasktrace/releases/download/latest/TaskTrace.dmg",
              "signing": os.environ["SIGNING"],
              "built_from": os.environ["GITHUB_SHA"],
          }
          json.dump(info, open("latest.json", "w"), indent=1)
          print(json.dumps(info, indent=1))
          PY
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "TaskTrace.dmg" latest.json build.log \
            --prerelease --target "$GITHUB_SHA" \
            --title "TaskTrace $VERSION (latest build)" \
            --notes "Download **TaskTrace.dmg** (version $VERSION), open it, and drag TaskTrace into Applications.
          Already have TaskTrace? Use **Check for updates…** in its menu instead.

          First launch: macOS will say it can't verify the developer (this build isn't signed with a paid Apple Developer ID).
          Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to TaskTrace. You only do this once.

          Built from $GITHUB_SHA. Requires an Apple silicon Mac on macOS 13 or newer."

      - name: Publish the build log on failure
        if: failure()
        run: |
          touch build.log
          gh release delete build-log --yes --cleanup-tag || true
          FILES="build.log"; [ -f dialog-screens.zip ] && FILES="$FILES dialog-screens.zip"
          gh release create build-log $FILES --prerelease --target "$GITHUB_SHA" \
            --title "Failed build log" --notes "Build log from a failed app build of $GITHUB_SHA."
