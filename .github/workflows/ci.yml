name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q
      - name: Import the macOS recorder (no permissions needed to import)
        if: runner.os == 'macOS'
        run: python -c "import tasktrace.recorder_macos as r; print(len(r.DEFAULT_EXCLUDED), 'excluded apps')"
