name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q
      - name: Import the macOS recorder and driver (no permissions needed to import)
        if: runner.os == 'macOS'
        run: python -c "import tasktrace.recorder_macos, tasktrace.drivers.macos; print('macOS modules import ok')"
